services:
    deputy-hub:
        image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-deputy-hub:latest
        build:
            dockerfile: docker/sirius-deputy-hub/Dockerfile
        ports: ["8888:8888"]
        read_only: true
        depends_on:
            json-server:
                condition: service_started
        privileged: false
        user: app
        environment:
            PORT: 8888
            SIRIUS_URL: http://json-server:3000
            HEALTHCHECK: /supervision/deputies/health-check
            PREFIX: /supervision/deputies
            FEATURES:

    json-server:
        build:
            dockerfile: docker/json-server/Dockerfile
        ports:
            - "3000:3000"

    go-lint:
        image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
        working_dir: /go/src/app
        volumes:
            - ./:/go/src/app
            - ./.cache/golangci-lint/v2.2.1:/root/.cache
        command: golangci-lint run -v --timeout 5m

    gosec:
        image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
        working_dir: /app
        volumes:
            - .:/app
        command: go tool gosec -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

    npm:
        build:
            dockerfile: docker/npm/Dockerfile
        command: ["ci", "--ignore-scripts"]
        volumes:
            - ./:/home/node/app

    test-runner:
        build:
            context: docker/test-runner/
        command: gotestsum --junitfile test-results/unit-tests.xml -- ./... -coverprofile=test-results/test-coverage.txt
        working_dir: /go/src/app
        volumes:
            - ./:/go/src/app
            - ./.gocache:/go/pkg/mod

    cypress:
        build:
            dockerfile: docker/cypress/Dockerfile
        command: ["--headless", "-b", "chrome"]
        volumes:
            - ./cypress/screenshots:/root/cypress/screenshots:rw,delegated
            - ./cypress/logs:/root/cypress/logs:rw,delegated
        depends_on:
            - deputy-hub
            - json-server
